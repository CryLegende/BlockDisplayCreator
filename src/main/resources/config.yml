#If set to false, players without blockdisplaycreator.blocks-destruction permission are prohibited from destroying custom blocks.   By def true
blocks-destruction: true
#If set to false, players without blockdisplaycreator.blocks-placement permission are prohibited from placing custom blocks.   By def true
blocks-placement: true
#If set to false, players without blockdisplaycreator.blocks-interaction permission are prohibited from interacting with custom blocks.   By def true
blocks-interaction: true

#If the number of entities in the chunk where the custom block is placed is greater than the specified amount, the block will not be placed.
#This parameter is made to avoid entities disappearing on some server core.
#If a negative number is specified, the check will not be performed.   By def -1
max-entities-per-chunk: -1

#If set to true, the display entities of custom blocks are not created on the server: their model is sent to the players around them.
#Blocks already placed are converted when their chunk loads, and converted back if this is set to false again.
#Needs a Paper server; on other servers custom blocks keep their display entities.   By def true
packet-display: true

#If set to true, the frames of the animations of custom blocks that players do not need are left out: a player's game
#moves a part between two poses by itself, so a frame its motion already passes by (within 1/64 of a block) is not sent.
#Worked out once per file, off the main thread, and kept in animation-cache.txt. An animation keeps all its frames
#with optimise: false in its section.   By def true
animation-optimisation: true

#If set to true, a custom block item given before its file changed gets the name and lore of the file back when its
#owner joins and when a player opens a container block holding it (not in the menus of other plugins). A file whose
#name or lore holds a placeholder is left out.   By def true
items-follow-files: true

#The gizmo: shift + right click on a custom block shown through packets, where the player may build.
gizmo:
  #How far a player may shrink and grow a block with the size bar of the gizmo, in times the size its file gives.   By def 0.75 and 1.25
  size-min: 0.75
  size-max: 1.25
  #The same for those with the bdc.gizmo.admin permission. Their bar is logarithmic (1 stands in its middle when
  #admin-size-min times admin-size-max is 1), and the admin panel gives the same limits.   By def 0.1 and 10
  admin-size-min: 0.1
  admin-size-max: 10
  #The cooldowns the cooldown icon of the admin panel goes through (left click: the next one, right click: the one before).
  admin-cooldowns:
  - 0
  - 1s
  - 5s
  - 30s
  - 1m
  - 5m
  - 1h
  - 24h
  #Sounds of the admin panel (names from https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html).
  admin-sounds:
    open: UI_TOAST_IN
    click: UI_BUTTON_CLICK
    refused: BLOCK_NOTE_BLOCK_BASS
