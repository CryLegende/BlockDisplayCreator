#visible-if, a player arriving caught up. Its place animations do not play, and none of its click boxes and collisions is created: the other plugin
#takes the clicks with its own click box. Breaking, the gizmo, the settings of a block, /bdc animation and chunk wipes leave it alone, a block placed
