#Centeral material that will be filled depending on where the block is placed.   By def BARRIER
central-material: BARRIER

#Count of sides of the block. Can be set in the range from 1 to 360.     By def 4
sides-count: 96

#Item of this block.  Only material is a required field
item:
  #Item material
  material: PLAYER_HEAD
  #Item name.  By def the block name is selected
  name: "&x&A&2&8&0&1&3R&x&9&C&7&B&1&2e&x&9&5&7&5&1&1a&x&8&F&7&0&1&0l&x&8&9&6&B&0&Fi&x&8&2&6&6&0&Es&x&7&C&6&0&0&Dt&x&7&6&5&B&0&Ci&x&6&F&5&6&0&Ac &x&6&3&4&B&0&8b&x&5&C&4&6&0&7a&x&5&6&4&1&0&6r&x&5&0&3&C&0&5r&x&4&9&3&6&0&4e&x&4&3&3&1&0&3l"
  #Item enchantments, created as <enchantment name>: <level>.
  enchantments:
    LURE: 1
  #item-flags of the item.
  item-flags:
    - HIDE_ENCHANTS
  #Item lore
  lore:
    - "&9Barrel with a secret"
  skullmeta:
    url: http://textures.minecraft.net/texture/c67d5d37cd64ce3fb57377d25d6152aa4ac2e37954248d5d91f88fbd791f4766

#Interaction Entities of this block.   The field may be missing, then all parameters are given by default
interactions:
  #Interaction name
  interaction:
    #Interaction Entity height.  By def 0
    height: 1.1
    #Interaction Entity width.  By def 0
    width: 1.001
    #Offset of this interaction entity relative to the central location of the custom block. Supports rotation-dependent offset changes
    offset:
      x: 0
      y: 0
      z: 0

    #Command or commands that are called when the player interacts (right-clicks) with the Interaction Entity of this block.   By def absent
    #%player% is the player who clicked (PlaceholderAPI placeholders work too). {x} {y} {z} and {world} are the block coordinates and the world the custom block was placed in (not where a gizmo moved the model).
    command:
      - /minecraft:playsound minecraft:ambient.cave player @s
    #Command source (PLAYER who clicked on the interaction entity or CONSOLE).   By def CONSOLE
    command-source: PLAYER
    #Temporary permissions that are granted before executing commands and are removed after executing (those that were missing)
    granted-command-permission:
    - minecraft.command.playsound
    #Time before the same player can run these commands again: 24h, 1d, 2h30m, 90s, 500ms (a plain number is milliseconds).   By def 0
    #From 1 minute on, the time is kept on the player (it outlives restarts and /bdc reload) and a click during the wait tells them how long is left.
    #The _2, _3 copies of a long click box (interaction_2...) share the cooldown of their box.
    #cooldown: 24h


#Collision Entities of this block.
collisions:
  #Collision name
  main:
    #Size of the collision entity. **Works only on Minecraft 1.20.5 and above**, since the scale attribute used to set collision size was introduced in 1.20.5.
    size: 0.8
    #Offset of this collision entity relative to the central location of the custom block. Supports rotation-dependent offset changes.
    offset:
      x: 0
      y: 0.01
      z: 0

    #If true, the collision entity will not be spawned on versions below 1.20.5 (before the scale attribute for collision size was added).   By def false.
    disable-below-1_20_5: true


#Sounds of this block (the list of sound-types can be found at https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html).   Volume and pitch are set to 1 by default
sound:
  #Break sound
  break:
    #Sound type.    By def ITEM_LODESTONE_COMPASS_LOCK
    sound-type: BLOCK_WOOD_BREAK
    volume: 2.5
    pitch: 0.6
  #Place sound
  place:
    #Sound type.    By def BLOCK_LODESTONE_PLACE
    sound-type: BLOCK_BARREL_OPEN
    volume: 1.7
    pitch: 3


#Animations of this block, played by the clients without any data pack.   The field may be missing
#They need the display entities to be shown through packets (packet-display in config.yml).
#animations:
#  #Animation name
#  hop:
#    #What starts it: loop (plays on and on), click (a right click on an interaction), place (when the block is placed),
#    #command (only /bdc animation play <player|selector|*> <animation> <x> <y> <z> [world], which can also start the others but loops)
#    #or approach (a player who comes close, see radius and cooldown).
#    #Played for chosen players, only they see it and hear its sounds, and once it ends they see the block as the others do; * plays it for everyone.
#    #   By def loop
#    trigger: click
#    #Click only: the interaction that starts it.   By def any interaction
#    interaction: interaction
#    #Approach only: a player who comes within this many blocks of the block sets it off, for him alone (he alone sees it and hears its sounds).
#    #He has to go further than radius + 0.5 before it can play again.   By def 4
#    #radius: 4
#    #Approach only: time before it can play again for the same player at the same block: 30s, 2m, 1h30m, 500ms (a plain number is milliseconds).
#    #Kept in memory: a restart, /bdc reload or the unloading of the chunk start it afresh.   By def 0
#    #A click of his on the block during it ends it (its parts glide back), so that he sees the click animation.
#    #cooldown: 30s
#    #Length in ticks. A loop starts over after them.   By def the end of the last frame
#    duration: 10
#    frames:
#        #Tick the frame starts at
#      - at: 0
#        #Ticks the parts take to get to it.   By def 0 (at once)
#        over: 4
#        #Display entities moved, numbered in the order of the summon command (0 is its root). Ranges are allowed.   By def all of them
#        parts: [1, 2, "5-9"]
#        #Blocks added to their resting place
#        move: [0, 0.4, 0]
#        #Degrees around X, Y and Z. A part takes the shortest way round: go by steps of less than 180 degrees
#        rotate: [0, 90, 0]
#        #One number, or one per axis
#        scale: [1.2, 0.8, 1.2]
#        #Point the rotation and the scale are made around.   By def the middle of the parts
#        pivot: [0, 1, 0]
#        #Sound played at the block (a sound key of the game), with its volume and pitch.   By def none, 1 and 1
#        sound: minecraft:block.barrel.open
#        volume: 1
#        pitch: 1.2
#        #A frame without move, rotate or scale takes its parts back to rest
#      - at: 4
#        over: 6
#        parts: [1, 2, "5-9"]
#  #A frame may give a single part the 16 numbers of a transformation instead, as bdengine writes them in a summon command:
#  #    - at: 0
#  #      over: 10
#  #      parts: [3]
#  #      transformation: [1,0,0,0.5, 0,1,0,1, 0,0,1,0.25, 0,0,0,1]
#  #An animation may also play sounds of its own, a tune for instance: a sound of the game, the tick it is played at, its pitch and its volume.
#  #    sounds:
#  #      - at: 12
#  #        sound: minecraft:block.note_block.harp
#  #        pitch: 1.2
#  #        volume: 1
#  #The sounds of an animation carry as far as those of the game (16 blocks). A shorter distance, in blocks, keeps them for the players standing in front of the block.   By def 0, that of the game
#  #    sound-range: 3
#  #Particles of the game shown along the animation, seen by those who see it (one played for a player alone: by him alone). The position
#  #(by def where the block stands) and the spread (offset, each way, by def none) are in blocks, in the model's axes at size 1 as move is:
#  #they follow the rotation, moves and size of the block, and the whole model when root frames move it. count is at most
#  #animation-particles-max of config.yml (64). dust also takes color "#RRGGBB" and size; particles needing a block or an item are refused.
#  #    particles:
#  #      - at: 12
#  #        particle: enchant
#  #        count: 8
#  #        offset: [0.3, 0.2, 0.3]
#  #        speed: 0.05
#  #        position: [0, 1.2, 0]
#  #A loop only: it plays for the players within this many blocks of the block; the others see its parts at rest and are sent none of its frames
#  #nor sounds. Coming within it, a player sees the parts glide from rest into the loop; going further than distance + 2, glide back to rest.   By def every player who sees the block
#  #    distance: 16
#  #A frame may move the whole model at once (a flying character bobbing, a jump): root is where it takes it, in blocks from where the block stands,
#  #in the model's axes at size 1 as move is. Whatever the number of parts, a client gets one small packet for it; the parts keep their own frames on top.
#  #A frame with a root moves no part unless it also has parts, move, rotate, scale or transformation. Over 59 ticks it is cut into pieces along the same line.
#  #    - at: 0
#  #      over: 30
#  #      root: [0, 0.06, 0]
#  #    - at: 30
#  #      over: 30
#  #      root: [0, 0, 0]

#Parts that turn on and on around the vertical axis of the model (a carousel, a fan): through the yaw of their entities, which the players'
#games glide on their own, one small packet every step ticks instead of many frames a turn. They still play the frames that move them
#(an up and down on top). A block hung on a wall or tipped by an operator does not spin. An administrator stopping the loops stops it too.   The field may be missing
#spin:
#  #Display entities that turn, numbered as in the frames.   Required
#  parts: [3, 4, "8-12"]
#  #Ticks a whole turn takes, 4 or more: clockwise seen from above, a negative number the other way.   Required
#  period: 240
#  #Ticks between two packets, 59 at most and less than half the period.   By def a third of the period, 40 at most
#  step: 40

#Settings of the frames that move the whole model (root, see the animations above).   The field may be missing
#The parts ride an invisible display, which those frames move. A part riding it that goes lower than half a block under the block is drawn at all times.
#root-motion:
#  #Parts that stay where they are when the whole model moves (a shadow on the ground), numbered as in the frames.   By def none
#  exclude: [12]

#Parts that turn towards each player standing close by, as the head of a character does.   The field may be missing
#Each player sees them turned towards himself (the others see them as they are), and back as they were once he goes further than radius + 0.5.
#While they look at a player, the frames of the loops that move them are kept from him: he sees them at rest, turned to him, the other parts keep moving.
#An animation that moves them goes first (a click one everyone sees, one played for him alone): they turn to him again once it ends.
#A player who stands still is sent nothing. They need the display entities to be shown through packets (packet-display in config.yml).
#look-at:
#  #Display entities that turn together, numbered as in the frames of the animations.   Required
#  parts: "3-5"
#  #Point they turn around (the neck), in blocks from the block base, written for the model at size 1 as the pivots of the frames.   By def the middle of the bottom of the parts
#  pivot: [0, 1.4, 0]
#  #Players whose eyes are closer than this to the pivot, in blocks, are looked at.   By def 6
#  radius: 6
#  #Degrees the parts turn at most to the left and to the right, then up and down.   By def 70 and 30
#  yaw: 70
#  pitch: 30
#  #Ticks a turn takes. Also the fewest ticks between two turns for one player.   By def 4
#  over: 4
#  #Degrees the direction of a player has to change by before the parts turn again.   By def 1.5
#  step: 1.5
#  #Which way the parts look at rest, in degrees around the vertical axis of the model, from its front: the side that faces whoever placed the block,
#  #the +Z of the summon command. 180 for parts made looking the other way, 90 or -90 for a side.   By def 0
#  facing: 0
#  #Whether the loops keep moving the parts while they look at a player: each frame of a loop that moves them reaches him turned towards him
#  #(a hat tipping, hair moving, a head bobbing with its body), and a turn starts from where the loops have them. Their idle motion is added
#  #to the look: a loop that turns the head to the side turns it as much to the side of the player.   By def false (at rest, turned to him)
#  loop: true

#Whether a hit breaks the placed blocks of this file.   By def true
#With false, nobody breaks them by hitting them, not even an operator (who is told how to remove one): /bdc custom-block break <x> <y> <z> [world] does.
#breakable: false

#Settings of the display section above for blocks shown through packets (packet-display in config.yml).   The fields may be missing
#display:
#  #How far players are sent the block, in blocks, height included.   By def the distance the world tracks display entities at
#  view-distance: 24
#  #How many blocks above it, and below it, players are still sent the block.   By def view-distance, both ways
#  #A block in a cave needs a small view-above only: the players walking on the ground over it are not sent it, nor its animations.
#  #A block on the ground needs a small view-below only: the players in the caves under it are not.
#  view-above: 12
#  view-below: 6
#  #Players who see the block: only those for whom this condition, or every condition of a list, is true.   By def everyone
#  #A condition is "<A> <op> <B>", op among ==, !=, >=, <=, >, < and contient, !contient (written between spaces).
#  #Both sides go through {x} {y} {z} and {world} (the block coordinates and the world the custom block was placed in), %player% (the player) then PlaceholderAPI.
#  #Numbers compare as numbers (spaces and thousand separators ignored, comma or dot decimal), anything else as text without colour codes, case nor accents (>=, <=, >, < are then false).
#  #Checked when a player comes in range, then every second: the block appears or disappears for him within a second.
#  #Only the players who see it can click it, bump into it and hear its sounds. An animation played for a player alone (/bdc animation play <player>) ends before the block goes for him.
#  #Without PlaceholderAPI, its placeholders stay as written.
#  visible-if:
#    - "%questcreator_variable_secret_miel% == 1"
#    - "%shenigmes_abeilles_trouve_3% == false"

#For other plugins: the model of a file shown at a point, nothing of it written in the world (no block, no chunk data, no entity on the server).
