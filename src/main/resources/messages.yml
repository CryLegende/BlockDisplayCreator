#Any message set to "" is not sent at all.

#Message displayed when placing a block in a chunk that exceeds the max-entities-per-chunk limit
max-entities-per-chunk: "&cYou cannot place a custom block in this chunk!"

#Messages displayed when a player performs an action for which he does not have permission specified in the permission section of the block file
permission-denied:
  place: "&cYou do not have permission to place this block."
  break: "&cYou do not have permission to break this block."
  interact: "&cYou do not have permission to interact with this block."

#Messages displayed when a player performs an action in a WorldGuard region and that action is denied (due to lack of access)
region-denied:
  place: "&c&lHey! &r&7Sorry, but you can`t place that custom block here."
  break: "&c&lHey! &r&7Sorry, but you can`t break that custom block here."
  interact: "&c&lHey! &r&7Sorry, but you can`t interact with that custom block here."

#Message displayed to a player allowed to break custom blocks who hits one whose file says breakable: false (%x% %y% %z% %world% = the block)
protected:
  break: "&7This custom block is protected (breakable: false). Remove it with &f/bdc custom-block break %x% %y% %z% %world%&7."

#Messages displayed when a player performs an action on a Skyblock island and that action is denied (due to lack of access)
island-denied:
  place: "&c&lError | &7This island is protected. You cannot place custom blocks here."
  break: "&c&lError | &7This island is protected. You cannot break custom blocks here."
  interact: "&c&lError | &7This island is protected. You cannot interact with custom blocks here."


custom-block:
  place:
    fail-reason:

      solid-block: "Material at location %x% %y% %z% in world %world% is solid and break_solid_material option is not set."
      chunk-not-loaded: "Location %x% %y% %z% in world %world% is not loaded and load_chunk option is not set."
      custom-block-present: "A custom block is already present at location %x% %y% %z% in world %world% and replace_custom_block option is not set."

  break:
    fail-reason:
      no-custom-block: "There is no custom block to break at location %x% %y% %z% in world %world%."

  # Message displayed when a player tries to use a custom block that does not exist (for example, if the block was deleted or was not loaded correctly)
  not-found: "&cCustom block %customblock_name% not found! Perhaps it was deleted or was not loaded correctly."


command:
  # Message displayed when a sender tries to execute a command that requires a custom block name, but does not provide one
  block-not-exists: "&cBlock &4%customblock_name% &cdoes not exist!"

  # Message displayed after executing the /bdc reload command
  reload: "&aBlockDisplayCreator config has been reloaded!"
  # Message displayed after executing the /bdc reload <block_name> command
  reload-block: "&aBlock %customblock_name% has been reloaded!"

  custom-block:

    give:
      # Message displayed when player receives a custom block
      player-receive: "&aYou have received the &b%customblock_name%&ox&b%amount%&a block"
      # Message displayed when console or a command block gives a custom block to a certain player
      give-player: "&aBlock &b%customblock_name%&ox&b%amount%&a was successfully given to the player &b%player%&a!"
      # Message displayed when console or a command block gives a custom block to several players at once
      give-players: "&aBlock &b%customblock_name%&ox&b%amount%&a was successfully given!"

      # Message displayed when no block receiver is specified
      no-player: "&cYou have not specified the block receiver!"

    place:
      # Message displayed when a block is successfully placed
      placed: "&aSuccessfully placed the block &b%customblock_name%&r&a at location &b%x% %y% %z% &ain the world &b%world%&a!"

      # Message displayed when no target location is specified
      invalid-attached-face: "&cInvalid attached face: %face%. Valid values are: &bnorth, south, east, west, up, down"

      # Message displayed when block placement fails for any reason
      failed: "&cFailed to place the block %customblock_name%: %reason%"
      # Message displayed when block placement fails for an unknown reason (no specific reason provided)
      failed-without-reason: "&cFailed to place the block &b%customblock_name%&r&c at &b%x% %y% %z% &cin the world &b%world%&c!"

      # Descriptions of the options that can be used when placing a block. Displayed in the argument tooltip.
      option-description:
        replace-custom-block: "&eReplaces an existing custom block at the target location"
        load-chunk: "&eLoads the chunk before placing the block, if needed"
        break-solid-material: "&eDestroys a solid vanilla block at the target location, if present"
        silent-place: "&eSuppresses block placement sounds"

    break:
      # Message displayed when a block is successfully broken
      broken: "&aSuccessfully broke the block &b%customblock_name%&r&a at location &b%x% %y% %z% &ain the world &b%world%"

      # Message displayed when no custom block is found at the specified location
      no-custom-block: "&cNo custom block found at &4%x% %y% %z% &cin the world &4%world%&c!"

      # Descriptions of the options that can be used when breaking a block. Displayed in the argument tooltip.
      option-description:
        drop-item: "&eDrops the corresponding item when breaking the block"
        silent-break: "&eSuppresses block breaking sounds"

    editfile:
      # Message displayed when a certain block parameter has been set to a certain value.
      set: "&aBlock &b%customblock_name%&a parameter &b%parameter%&a was successfully set to \"&b%value%&a\"."

#    create:
#        # Message displayed when a custom block is created successfully
#      success: "&aCustom block with the name &b%customblock_name%&a has been created successfully!"





#Message displayed when a click comes back too early on a click box (or a placed block) with a cooldown of a minute or more (%time% = what is left)
cooldown:
  wait: "&8&l« &6&lSH &8&l» &7Revenez dans &6%time%&7."

#Message displayed when a player without the permission an administrator set on one placed block clicks it
placed-denied:
  interact: "&8&l« &c&lSH &8&l» &7Tu n'as &cpas accès&7 à ceci."

#Texts of the gizmo (shift + right click on a custom block shown through packets)
gizmo:
  opened: "&8&l« &e&lSH &8&l» &7Gizmo &eactivé&7 : vise une pièce, &eclic gauche&7 pour la prendre, de nouveau pour la poser."
  #%min% and %max% = the sizes the bar goes from and to, in %
  help: "&7Molette &8: &epas &8· &7Shift+F &8: &eaimantation &8· &7F &8: &eaxes &8· &7clic droit sur une pièce &8: &ela remettre à zéro &8· &7bouton rouge &8: &etout remettre &8· &7curseur blanc &8: &etaille (%min% à %max% %)&8 · &7Shift + clic droit &8: &efermer"
  help-admin: "&7Molette &8: &epas &8· &7Shift+F &8: &eaimantation &8· &7F &8: &eaxes &8· &7clic droit sur une pièce &8: &ela remettre à zéro &8· &7bouton rouge &8: &etout remettre &8· &7curseur blanc &8: &etaille (%min% à %max% %)&8 · &7bloc de commande &8: &eréglages de ce bloc seul &8· &7Shift + clic droit &8: &efermer"
  closed: "&8&l« &e&lSH &8&l» &7Gizmo &efermé&7."
  failed: "&8&l« &c&lSH &8&l» &7Le gizmo &cn'a pas pu s'ouvrir&7."
  too-far: "&8&l« &6&lSH &8&l» &7Gizmo &6fermé&7 : tu t'es &6trop éloigné&7 du modèle."
  refused: "&8&l« &c&lSH &8&l» &7Tu ne peux pas &cdéplacer&7 ce modèle &chors de ton île&7."
  locked: "&8&l« &6&lSH &8&l» &7Ce modèle a été &6verrouillé&7 par un admin : il ne se déplace pas."
  already-at-origin: "&8&l« &6&lSH &8&l» &7Ce modèle est &6déjà à sa place d'origine&7."
  nothing-to-reset: "&8&l« &6&lSH &8&l» &7Rien à &6remettre à zéro&7 ici."
  #Action bar while the gizmo is open: %readout% = the part aimed at or what it changes, %step%, %axes%
  status: "&6&lGizmo &8» &f%readout% &8| &7pas &e%step% &8| &7axes &e%axes% &8| &7clic droit &eremise à zéro"
  readout:
    aim: "vise une pièce"
    free-step: "libre"
    model-axes: "du modèle"
    world-axes: "du monde"
    reset-all: "Remis à l'origine"
    reset: "%part% remis à zéro"
  label:
    move: "Déplacer %axis%"
    size: "Taille"
    reset: "Remettre à l'origine"
    turn: "Tourner"
    tilt: "Pencher"
    admin: "Réglages de ce bloc seul"

#The admin panel of the gizmo (command block of the gizmo, or /bdc settings): what is set on one placed block alone.
#Each icon has a material, a name and a lore; a lore line holding %list% gives one line per command.
gizmo-admin:
  title: "&8&lRéglages &8| %model%"
  none: "&8aucun"
  no-command: "&8aucune commande"
  command-line: "&8%n%. &f/%command%"
  server-distance: "celle du serveur, %blocks%"
  items:
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    info:
      material: LANTERN
      name: "&e&l%model%"
      lore:
        - "&7Bloc &f%where%"
        - "&7Note &8: &f%note%"
        - ""
        - "&7Ces réglages ne valent que pour &ece bloc&7 :"
        - "&7les autres &f%model% &7gardent leur fichier."
        - "&7Réglages changés &8: &e%count%"
    size:
      material: SLIME_BALL
      name: "&eTaille &8: &f%value%"
      lore:
        - "&7De %min% à %max% de la taille du fichier."
        - "&7Il grandit depuis le sol, la zone cliquable"
        - "&7et la collision suivent."
        - ""
        - "&8Clic gauche &7: &f+10 %"
        - "&8Clic droit &7: &f-10 %"
        - "&8Shift + clic gauche &7: &fécrire une valeur"
        - "&8Shift + clic droit &7: &f100 %"
    view-distance:
      material: SPYGLASS
      name: "&eDistance d'affichage &8: &f%value% blocs"
      lore:
        - "&7Jusqu'où les joueurs voient ce bloc,"
        - "&7autour de lui, au-dessus et en dessous."
        - "&7Celle du modèle &8: &f%model%"
        - ""
        - "&8Clic gauche &7: &f+8 blocs"
        - "&8Clic droit &7: &f-8 blocs"
        - "&8Shift + clic gauche &7: &fécrire une valeur"
        - "&8Shift + clic droit &7: &fcelle du modèle"
    loops:
      material: REPEATER
      name: "&eAnimations en boucle &8: %state%"
      state-on: "&ajouées"
      state-off: "&carrêtées"
      lore:
        - "&7Arrêtées, ce bloc reste immobile"
        - "&7(moins de paquets pour les joueurs)."
        - ""
        - "&8Clic &7: &fchanger"
    loops-none:
      material: GRAY_DYE
      name: "&8Animations en boucle"
      lore:
        - "&7Ce modèle n'en a pas."
    breakable:
      material: BEDROCK
      name: "&eCassable &8: %state%"
      state-on: "&aoui"
      state-off: "&cnon, même par un op"
      lore:
        - "&7Incassable, aucun coup ne le casse ;"
        - "&7le bouton &cCasser&7 de ce panneau le retire."
        - ""
        - "&8Clic &7: &fchanger"
    locked:
      material: IRON_BARS
      name: "&eGizmo &8: %state%"
      state-on: "&créservé aux admins"
      state-off: "&aceux qui peuvent construire ici"
      lore:
        - "&7Réservé, les joueurs de l'île ne peuvent"
        - "&7plus le déplacer ni le tourner."
        - ""
        - "&8Clic &7: &fchanger"
    note:
      material: NAME_TAG
      name: "&eNote &8: &f%value%"
      lore:
        - "&7Pour le staff, visible ici et dans"
        - "&f/bdc settings list&7."
        - ""
        - "&8Clic &7: &fécrire"
        - "&8Clic droit &7: &fretirer"
    commands:
      material: COMMAND_BLOCK
      name: "&eCommandes au clic &8: &f%count%"
      lore:
        - "&7Lancées quand un joueur clique ce bloc."
        - "&7%player% &8= &7le joueur, &7{x} {y} {z} {world} &8= &7le bloc."
        - ""
        - "%list%"
        - ""
        - "&8Clic gauche &7: &fajouter"
        - "&8Clic droit &7: &fretirer la dernière"
        - "&8Shift + clic droit &7: &ftout retirer"
    source:
      material: PLAYER_HEAD
      name: "&eLancées par &8: %state%"
      state-on: "&ble joueur"
      state-off: "&dla console"
      lore:
        - "&7La console peut tout faire (tp, heal...),"
        - "&7le joueur seulement ce qu'il a le droit de faire."
        - ""
        - "&8Clic &7: &fchanger"
    model-commands:
      material: CHAIN_COMMAND_BLOCK
      name: "&eCommandes du fichier &8: %state%"
      state-on: "&agardées"
      state-off: "&cremplacées"
      lore:
        - "&7Remplacées, seules les commandes"
        - "&7de ce bloc se lancent au clic."
        - ""
        - "&8Clic &7: &fchanger"
    model-commands-none:
      material: GRAY_DYE
      name: "&8Commandes du fichier"
      lore:
        - "&7Le fichier de ce modèle n'en a pas."
    click-animation:
      material: ARMOR_STAND
      name: "&eAnimation au clic &8: %state%"
      state-on: "&ajouée"
      state-off: "&carrêtée"
      lore:
        - "&7L'animation que le fichier joue"
        - "&7quand on clique ce modèle."
        - ""
        - "&8Clic &7: &fchanger"
    click-animation-none:
      material: GRAY_DYE
      name: "&8Animation au clic"
      lore:
        - "&7Ce modèle n'en a pas."
    cooldown:
      material: CLOCK
      name: "&eDélai entre deux clics &8: &f%value%"
      lore:
        - "&7Par joueur. Dès 1 min, il survit aux"
        - "&7redémarrages et le joueur voit le temps restant."
        - ""
        - "&8Clic gauche &7: &fplus long"
        - "&8Clic droit &7: &fplus court"
        - "&8Shift + clic gauche &7: &fécrire une durée"
        - "&8Shift + clic droit &7: &faucun"
    permission:
      material: TRIPWIRE_HOOK
      name: "&ePermission pour cliquer &8: &f%value%"
      lore:
        - "&7Sans elle, un clic ne fait rien."
        - ""
        - "&8Clic &7: &fécrire"
        - "&8Clic droit &7: &fretirer"
    click-box:
      material: STONE_BUTTON
      name: "&eZone cliquable &8: %state%"
      state-on: "&aajoutée"
      state-off: "&caucune"
      lore:
        - "&7Ce modèle n'en a pas : sans elle, ses"
        - "&7commandes au clic ne se lancent jamais."
        - "&7Elle prend la place de ce qu'il dessine."
        - ""
        - "&8Clic &7: &fchanger"
    click-box-model:
      material: OAK_BUTTON
      name: "&eZone cliquable &8: &acelle du fichier"
      lore:
        - "&7Ce modèle a déjà la sienne."
    copy:
      material: MAP
      name: "&eCopier ces réglages"
      lore:
        - "&7Pour les coller sur un autre bloc"
        - "&7(la taille ne se copie pas)."
    paste:
      material: FILLED_MAP
      name: "&eColler les réglages copiés"
      lore:
        - "&7Réglages copiés &8: &e%count%"
        - "&7Ils remplacent ceux de ce bloc."
    paste-empty:
      material: GRAY_DYE
      name: "&8Coller les réglages copiés"
      lore:
        - "&7Rien de copié pour l'instant."
    reset:
      material: STRUCTURE_VOID
      name: "&cTout remettre comme le fichier"
      lore:
        - "&7Retire tous les réglages de ce bloc."
        - "&7Sa place et sa taille restent :"
        - "&7le bouton rouge du gizmo les remet."
        - ""
        - "&8Shift + clic &7: &fconfirmer"
    break:
      material: BARRIER
      name: "&cCasser ce bloc"
      lore:
        - "&7Même incassable. Son objet va"
        - "&7dans ton inventaire."
        - ""
        - "&8Shift + clic &7: &fconfirmer"
    back:
      material: PAPER
      name: "&7Retour au gizmo"
  #Messages in the chat that suggest the command to finish (%command% = that command)
  prompt:
    hover: "&7Clique pour écrire &f%command%"
    size: "&8&l« &e&lSH &8&l» &7Écris la taille en % (ex. &e250&7) : &e&nclique ici"
    view-distance: "&8&l« &e&lSH &8&l» &7Écris la distance en blocs (ex. &e96&7) : &e&nclique ici"
    command: "&8&l« &e&lSH &8&l» &7Écris la commande, sans / (ex. &espawn %player%&7) : &e&nclique ici"
    cooldown: "&8&l« &e&lSH &8&l» &7Écris le délai (ex. &e60s&7, &e5m&7, &e24h&7) : &e&nclique ici"
    permission: "&8&l« &e&lSH &8&l» &7Écris la permission (ex. &eskyhand.vip&7) : &e&nclique ici"
    note: "&8&l« &e&lSH &8&l» &7Écris la note : &e&nclique ici"
  saved: "&8&l« &a&lSH &8&l» &7Réglage de &a%model%&7 enregistré."
  copied: "&8&l« &a&lSH &8&l» &7Réglages de &a%model%&7 copiés."
  broken: "&8&l« &a&lSH &8&l» &a%model%&7 cassé, son objet est dans ton inventaire."
  confirm-reset: "&8&l« &6&lSH &8&l» &6Shift + clic&7 pour tout remettre comme le fichier."
  confirm-break: "&8&l« &6&lSH &8&l» &6Shift + clic&7 pour casser ce bloc."
  gone: "&8&l« &c&lSH &8&l» &7Ce bloc &cn'est plus là&7."
  aim: "&8&l« &c&lSH &8&l» &7Vise un bloc de BDC (ou ouvre son gizmo), puis refais &c/bdc settings&7."
  open-first: "&8&l« &c&lSH &8&l» &7Ouvre d'abord les réglages d'un bloc : bloc de commande de son gizmo, ou &c/bdc settings&7 en le visant."
  no-permission: "&8&l« &c&lSH &8&l» &7Tu n'as &cpas la permission&7."
  players-only: "&cOnly a player can set a block from its panel."
  usage: "&8&l« &c&lSH &8&l» &7/bdc settings &8[&7size <%>&8 | &7view-distance <blocs>&8 | &7command add|remove|clear&8 | &7cooldown <durée>&8 | &7permission <perm>&8 | &7note <texte>&8 | &7list [rayon]&8]"
  bad-size: "&8&l« &c&lSH &8&l» &7La taille va de &c%min%&7 à &c%max%&7."
  bad-view-distance: "&8&l« &c&lSH &8&l» &7La distance va de &c1&7 à &c%max%&7 blocs (ou &cdefault&7)."
  bad-command: "&8&l« &c&lSH &8&l» &7Ce n'est &cpas une commande&7."
  bad-command-number: "&8&l« &c&lSH &8&l» &7Donne le numéro d'une des &c%count%&7 commandes."
  bad-cooldown: "&8&l« &c&lSH &8&l» &7Écris une durée comme &c60s&7, &c5m&7, &c2h30m&7 (ou &cnone&7)."
  bad-permission: "&8&l« &c&lSH &8&l» &7Une permission s'écrit &csans espace&7 (ou &cnone&7)."
  list-title: "&8&l« &e&lSH &8&l» &e%count%&7 bloc(s) réglé(s) à moins de %radius% blocs (clique pour t'y téléporter) :"
  list-line: "&8- &e%model% &7%where% &8(&7%count% réglage(s)&8) &f%note%"
  list-empty: "&8&l« &e&lSH &8&l» &7Aucun bloc réglé à moins de %radius% blocs."
